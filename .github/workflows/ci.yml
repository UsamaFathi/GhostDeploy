name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.14']
        include:
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ghostdeploy --help
      - run: ghostdeploy version
      - run: ghostdeploy validate --config examples/ghostdeploy.yml --output json
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test the wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys, tempfile;
          wheel = next(Path('dist').glob('*.whl'));
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheel)], check=True);
          directory = tempfile.TemporaryDirectory();
          subprocess.run([sys.executable, '-m', 'ghostdeploy', 'version'], cwd=directory.name, check=True)"
