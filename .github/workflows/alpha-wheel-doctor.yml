name: Fresh Alpha wheel on disposable Ubuntu Odoo
run-name: GhostDeploy 0.3.0a1 release diagnostics
on:
  push:
    branches: [verify/v0.3.0a1-doctor]
permissions:
  contents: read
jobs:
  ubuntu-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      APPROVED_SHA: e642106be0d07fdc6fa6cc30fdf5bb68d1e918b5
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and hash from the approved source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$APPROVED_SHA"
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          mkdir "$RUNNER_TEMP/alpha-source" "$RUNNER_TEMP/alpha-dist"
          git archive "$APPROVED_SHA" | tar -x -C "$RUNNER_TEMP/alpha-source"
          (cd "$RUNNER_TEMP/alpha-source" && python -m build --outdir "$RUNNER_TEMP/alpha-dist")
          (
            cd "$RUNNER_TEMP/alpha-dist"
            wheel=ghostdeploy-0.3.0a1-py3-none-any.whl
            sdist=ghostdeploy-0.3.0a1.tar.gz
            python -m twine check --strict "$wheel" "$sdist"
            sha256sum "$wheel" "$sdist" > SHA256SUMS
            sha256sum -c SHA256SUMS
            cat SHA256SUMS
          )
      - name: Install the release wheel and run doctor with real Odoo and systemd
        timeout-minutes: 18
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(cat /proc/1/comm)" = systemd
          sudo -n /usr/bin/true
          dependencies=$(mktemp -d "$RUNNER_TEMP/ghostdeploy-dependencies.XXXXXXXX")
          wheelhouse=$(mktemp -d "$RUNNER_TEMP/ghostdeploy-wheelhouse.XXXXXXXX")
          wheel="$RUNNER_TEMP/alpha-dist/ghostdeploy-0.3.0a1-py3-none-any.whl"
          python -m pip install --target "$dependencies" playwright==1.64.1
          python -m pip download --only-binary=:all: --dest "$wheelhouse" "$wheel"
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 tests/odoo/run_host.py "$dependencies" 19.0 \
            --release-wheel "$wheel" --wheelhouse "$wheelhouse" --installer-python "$(command -v python)"
          (cd "$RUNNER_TEMP/alpha-dist" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghostdeploy-0.3.0a1-verified
          path: ${{ runner.temp }}/alpha-dist/
          if-no-files-found: error
          retention-days: 3
