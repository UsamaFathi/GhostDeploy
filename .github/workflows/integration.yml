name: Disposable integration
run-name: Disposable ${{ inputs.suite }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Local fixture suite to run on the hosted runner
        type: choice
        options: [postgresql, odoo18, odoo19, browser18, browser19, ssh, systemd]
        required: true

permissions:
  contents: read

jobs:
  disposable:
    if: inputs.suite != 'systemd'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_FIXTURE_ID: ghostdeploy-ssh-fixture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - if: inputs.suite == 'postgresql'
        env:
          GHOSTDEPLOY_TEST_POSTGRESQL: '1'
        run: |
          python -m pip install -e '.[dev]'
          bindir=$(pg_config --bindir 2>/dev/null || true)
          if [[ ! -x "$bindir/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            bindir=$(pg_config --bindir)
          fi
          PATH="$bindir:$PATH" python -m pytest tests/integration -v
      - if: inputs.suite == 'odoo18'
        run: python tests/odoo/run.py 18.0
      - if: inputs.suite == 'odoo19'
        run: python tests/odoo/run.py 19.0
      - if: inputs.suite == 'browser18'
        run: python tests/odoo/run.py 18.0 --browser
      - if: inputs.suite == 'browser19'
        run: python tests/odoo/run.py 19.0 --browser
      - name: Build isolated OpenSSH image
        if: inputs.suite == 'ssh'
        timeout-minutes: 6
        run: docker build --file tests/ssh/Dockerfile --tag "$SSH_FIXTURE_ID" .
      - name: Run loopback SSH assertions
        if: inputs.suite == 'ssh'
        timeout-minutes: 3
        run: docker run --rm --name "$SSH_FIXTURE_ID" --network none "$SSH_FIXTURE_ID"
      - name: Remove owned SSH fixture resources
        if: always() && inputs.suite == 'ssh'
        timeout-minutes: 1
        run: |
          docker container rm -f "$SSH_FIXTURE_ID" >/dev/null 2>&1 || true
          docker image rm "$SSH_FIXTURE_ID" >/dev/null 2>&1 || true
  systemd:
    if: inputs.suite == 'systemd'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Test one disposable systemd service and sudo rule
        shell: bash
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]] ||
             [[ "$(cat /proc/1/comm)" != systemd ]] ||
             ! sudo -n /usr/bin/true; then
            echo 'SKIP: a disposable runner with systemd PID 1 and provisioning sudo is required.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dependencies=$(mktemp -d "$RUNNER_TEMP/ghostdeploy-systemd.XXXXXXXX")
          trap 'rm -rf -- "$dependencies"' EXIT
          python -m pip install --target "$dependencies" .
          result=0
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 tests/systemd/run.py "$dependencies" || result=$?
          if [[ "$result" == 77 ]]; then
            echo 'SKIP: the disposable systemd fixture could not run on this runner.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$result"
