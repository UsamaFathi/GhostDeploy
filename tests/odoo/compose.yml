services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: ghost_fixture_admin
      POSTGRES_PASSWORD: ${GHOSTDEPLOY_FIXTURE_TOKEN:?set by the fixture runner}
      POSTGRES_DB: ghostdeploy_fixture
      GHOSTDEPLOY_FIXTURE_TOKEN: ${GHOSTDEPLOY_FIXTURE_TOKEN:?set by the fixture runner}
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ghost_fixture_admin, -d, ghostdeploy_fixture]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./fixture.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
  checks:
    build:
      context: ../..
      dockerfile: tests/odoo/Dockerfile
      target: ${GHOSTDEPLOY_FIXTURE_STAGE:?set by the fixture runner}
      args:
        ODOO_TEST_VERSION: ${ODOO_TEST_VERSION:?set by the fixture runner}
    depends_on:
      database:
        condition: service_healthy
    environment:
      ODOO_TEST_VERSION: ${ODOO_TEST_VERSION:?set by the fixture runner}
      GHOSTDEPLOY_FIXTURE_STAGE: ${GHOSTDEPLOY_FIXTURE_STAGE:?set by the fixture runner}
      GHOSTDEPLOY_FIXTURE_TOKEN: ${GHOSTDEPLOY_FIXTURE_TOKEN:?set by the fixture runner}
    entrypoint: [/opt/ghostdeploy/bin/python, /fixture/check_upgrade.py]
networks:
  default:
    internal: true
volumes:
  pgdata:
